openapi: 3.0.3
info:
  title: Orchestrator Intent Routing Contract
  version: 0.1.0
  description: >-
    Contract for single-destination intent classification and deterministic routing
    through the Orchestrator.
paths:
  /api/orchestrator/route:
    post:
      summary: Classify intent and return deterministic route decision
      operationId: classifyAndRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
      responses:
        '200':
          description: Route decision resolved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    RouteRequest:
      type: object
      required:
        - request_id
        - user_id
        - session_id
        - utterance
      properties:
        request_id:
          type: string
        user_id:
          type: string
        session_id:
          type: string
        utterance:
          type: string
          minLength: 1
        metadata:
          type: object
          additionalProperties: true

    CandidateScore:
      type: object
      required:
        - domain
        - confidence
      properties:
        domain:
          type: string
          enum: [calendar, travel, dining, news, companion]
        confidence:
          type: number
          minimum: 0
          maximum: 1

    RouteRationale:
      type: object
      required:
        - threshold
        - tie_window
        - top_candidates
        - reason_code
      properties:
        threshold:
          type: number
          minimum: 0
          maximum: 1
        tie_window:
          type: number
          enum: [0.03]
        top_candidates:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/CandidateScore'
        tie_break_winner:
          type: string
          enum: [calendar, travel, dining, news, companion]
        reason_code:
          type: string
          enum:
            - highest_above_threshold
            - tie_break_selected
            - below_threshold_fallback

    RouteResponse:
      type: object
      required:
        - request_id
        - selected_domain
        - fallback_to_companion
        - threshold_passed
        - tie_detected
        - rationale
      properties:
        request_id:
          type: string
        selected_domain:
          type: string
          enum: [calendar, travel, dining, news, companion]
        fallback_to_companion:
          type: boolean
        threshold_passed:
          type: boolean
        tie_detected:
          type: boolean
        rationale:
          $ref: '#/components/schemas/RouteRationale'
        routing_record_id:
          type: string
          description: Identifier for traceability record in request context.

    ErrorResponse:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
        message:
          type: string
        request_id:
          type: string
